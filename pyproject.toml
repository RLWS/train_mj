[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mjai"
version = "0.1.0"
description = "Riichi Mahjong AI training pipeline for Tenhou data and Mahjong Soul deployment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "numpy>=1.24",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
training = [
    "tensorboard>=2.16",
]

[project.scripts]
mjai = "mjai.cli:main"

[tool.setuptools.packages.find]
include = ["mjai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
