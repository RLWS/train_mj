api:
  host: 127.0.0.1
  port: 8000
  enable_docs: true
  request_timeout_seconds: 5
  max_legal_actions: 64
  debug_log_requests: true
  debug_log_responses: true
  debug_log_max_body_chars: 20000
  debug_log_logger: uvicorn.error

device: auto

models:
  turn:
    checkpoint: runs/2026-05-10_p800_improved/turn/checkpoints/best.pt
  response:
    checkpoint: runs/2026-05-10_p800_improved/response/checkpoints/best_response.pt
    pass_bias:
      default: 0.3
      recall: 0.16
      conservative: 0.4

security:
  api_key_env: MJAI_API_KEY
  allow_without_api_key: true
  header_name: X-API-Key
