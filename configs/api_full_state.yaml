api:
  host: 127.0.0.1
  port: 8001
  enable_docs: true
  request_timeout_seconds: 5
  max_legal_actions: 64
  debug_log_requests: true
  debug_log_responses: true
  debug_log_max_body_chars: 20000
  debug_log_logger: uvicorn.error

device: auto

models:
  turn:
    checkpoint: outputs/checkpoints/multitask_full_state_v2_ddp/best_turn.pt
  response:
    checkpoint: outputs/checkpoints/multitask_full_state_v2_ddp/best_response.pt
    pass_bias:
      default: 2.0
      recall: 0.0
      conservative: 0.16
    no_yaku_call_penalty: 0.8

security:
  api_key_env: MJAI_API_KEY
  allow_without_api_key: true
  header_name: X-API-Key
